# Cloudflare Pages project for wavescaperi.org
name = "wavescape"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[vars]
BASE_ADDRESS = "19 Hope Rd, Cranston, RI"
SQUARE_ENVIRONMENT = "sandbox"   # change to "production" when going live

# Booking database. Create it with: npx wrangler d1 create wavescape
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "wavescape"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Customer photo uploads. Create it with: npx wrangler r2 bucket create wavescape-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavescape-photos"
